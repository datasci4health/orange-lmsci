<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    width="571"
    height="571"
    viewBox="0 0 571 571"
    xmlns="http://www.w3.org/2000/svg">

  <g stroke="#222" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- Head -->
    <rect x="100" y="180" width="371" height="250" rx="60" fill="#e6e6e6"/>

    <!-- Left ear -->
    <circle cx="100" cy="305" r="40" fill="#e6e6e6"/>

    <!-- Right ear -->
    <circle cx="471" cy="305" r="40" fill="#e6e6e6"/>

    <!-- Antenna -->
    <line x1="140" y1="180" x2="120" y2="90"/>
    <circle cx="120" cy="70" r="14" fill="#bbb"/>

    <!-- Eyes (outer rings) -->
    <circle cx="230" cy="300" r="65"/>
    <circle cx="350" cy="300" r="65"/>

    <!-- Eyes (inner rings) -->
    <circle cx="230" cy="300" r="40"/>
    <circle cx="350" cy="300" r="40"/>

    <!-- Pupils -->
    <circle cx="230" cy="300" r="18" fill="#222"/>
    <circle cx="350" cy="300" r="18" fill="#222"/>

    <!-- Highlights -->
    <circle cx="220" cy="285" r="6" fill="#fff" stroke="none"/>
    <circle cx="340" cy="285" r="6" fill="#fff" stroke="none"/>

    <!-- Mouth -->
    <path d="M240 380 Q285 405 330 380" stroke-width="12"/>

  </g>
</svg>
