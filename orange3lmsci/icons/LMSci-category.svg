<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    width="571"
    height="571"
    viewBox="0 0 571 571"
    xmlns="http://www.w3.org/2000/svg">

  <g stroke="#222" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- CENTRAL ROBOT -->
    <rect x="180" y="200" width="210" height="170" rx="50" fill="#e6e6e6"/>

    <!-- Eyes -->
    <circle cx="245" cy="270" r="45"/>
    <circle cx="325" cy="270" r="45"/>

    <circle cx="245" cy="270" r="25"/>
    <circle cx="325" cy="270" r="25"/>

    <circle cx="245" cy="270" r="10" fill="#222"/>
    <circle cx="325" cy="270" r="10" fill="#222"/>

    <!-- Smile -->
    <path d="M240 330 Q285 355 330 330" stroke-width="12"/>

    <!-- Antenna -->
    <line x1="210" y1="200" x2="190" y2="130"/>
    <circle cx="190" cy="110" r="12" fill="#bbb"/>

    <!-- TOP: Chat -->
    <rect x="235" y="70" width="150" height="90" rx="20"/>
    <polygon points="300,160 320,160 300,185" fill="#222" stroke="none"/>
    <line x1="255" y1="100" x2="365" y2="100" stroke="#555" stroke-width="6"/>
    <line x1="255" y1="125" x2="340" y2="125" stroke="#555" stroke-width="6"/>

    <!-- LEFT: Text -->
    <rect x="60" y="230" width="90" height="90" rx="18"/>
    <line x1="80" y1="265" x2="130" y2="265" stroke-width="8"/>
    <line x1="80" y1="295" x2="120" y2="295" stroke-width="8"/>

    <!-- RIGHT: Analytics -->
    <rect x="421" y="230" width="90" height="90" rx="18"/>
    <rect x="440" y="275" width="12" height="25" fill="#222"/>
    <rect x="460" y="260" width="12" height="40" fill="#222"/>
    <rect x="480" y="245" width="12" height="55" fill="#222"/>

    <!-- BOTTOM: Code -->
    <rect x="240" y="410" width="120" height="90" rx="18"/>
    <path d="M270 445 L250 455 L270 465" stroke-width="10"/>
    <path d="M330 445 L350 455 L330 465" stroke-width="10"/>

    <!-- CONNECTORS (orthogonal only) -->
    <line x1="285" y1="200" x2="285" y2="160"/>
    <line x1="180" y1="285" x2="150" y2="285"/>
    <line x1="390" y1="285" x2="421" y2="285"/>
    <line x1="285" y1="370" x2="285" y2="410"/>

  </g>
</svg>
